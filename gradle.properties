org.gradle.configuration-cache=true
# Кеш результатов задач: неизменившиеся модули (тесты core и driver) в CI берутся из кеша, а не гоняются заново.
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=37.0
android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
