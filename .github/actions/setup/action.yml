# Окружение сборки Podbor: JDK, Android SDK + NDK, Go для libXray, Gradle с кешем, кеш ассетов Xray.
name: Окружение сборки
description: JDK 21, Android SDK 37 + NDK, Go, Gradle, кеш ассетов Xray
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "21"
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370
        log-accepted-android-sdk-licenses: false
    # На раннере предустановлено несколько NDK — libXray собирается ровно этой.
    - shell: bash
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache: false
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    # Geo-файлы Xray и белые списки качаются сборкой по sha — кеш по тем же sha.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/podbor
        key: podbor-assets-${{ hashFiles('app/geo.sha256', 'app/whitelist.sha256') }}
