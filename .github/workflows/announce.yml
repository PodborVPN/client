# Пост о релизе в телеграм-канал: версия, разделы CHANGELOG, ссылка на страницу релиза. Зовёт выпуск в CI
# после APK; руками — на любой тег (проверка, повтор неудачного поста).
name: Пост о релизе

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    # Только телеграм-секреты: ключ подписи посту не нужен.
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v0.7.4
        type: string
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Текст поста
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,url,body | python3 -I .github/scripts/release-post.py > post.html
      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: post.html
          format: html
          disable_web_page_preview: true
