name: Выпуск Android

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Подготовить PR или выпустить APK после мёржа
        type: choice
        options: [prepare, publish]
        default: prepare
      tag:
        description: Тег существующего черновика для повтора выпуска
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-release

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare' && inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/android-release" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Подготовка PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: NODE_PATH="$RUNNER_TEMP/android-release/node_modules" node .github/scripts/android-release.cjs

  please:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish' && inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  apk:
    needs: [please]
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'publish' && !cancelled() && (needs.please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    env:
      TAG: ${{ needs.please.outputs.tag_name || inputs.tag }}
    steps:
      - id: source
        name: Черновик и исходники APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "тег не vX.Y.Z: $TAG" >&2; exit 1; }
          release=$(gh release view "$TAG" --json isDraft,targetCommitish)
          jq -e '.isDraft' <<< "$release" > /dev/null
          sha=$(jq -r '.targetCommitish' <<< "$release")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "нет коммита черновика" >&2; exit 1; }
          printf 'sha=%s\ntag=%s\n' "$sha" "$TAG" >> "$GITHUB_OUTPUT"
          echo "APK=podbor-${TAG#v}.apk" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
      - uses: ./.github/actions/setup
      - name: Версия приложения
        run: |
          [[ "$(cat version.txt)" == "${TAG#v}" ]]
      # Выпускной libXray — всегда с нуля, без кеша.
      - run: app/scripts/build-libxray.sh force
      # Без ключа релиз не выпускается: debug-подпись молча не подставляется.
      - name: Ключ подписи
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$SIGNING_KEYSTORE_BASE64" ]] || { echo "нет секрета SIGNING_KEYSTORE_BASE64" >&2; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew :core:test :driver:test :screen:jvmTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.APK }}
      - name: Публикация релиза с APK и SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$APK" --clobber
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          gh release view "$TAG" --json body --jq .body > notes.md
          printf '\n\n`%s` SHA-256: `%s`\n' "$APK" "$sha" >> notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest

  announce:
    needs: [apk]
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    uses: ./.github/workflows/announce.yml
    with:
      tag: ${{ needs.apk.outputs.tag }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
