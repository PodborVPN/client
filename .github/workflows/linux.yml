name: Сборка Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия образа Linux, например 0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Проверка версии
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ./gradlew :linux:test :remote:jvmTest :linux:dockerContext
      - name: Образ для проверки
        shell: bash
        run: |
          docker build --tag "podbor-linux:$VERSION" linux/build/docker
          docker save "podbor-linux:$VERSION" | gzip > "podbor-linux-$VERSION.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podbor-linux-${{ inputs.version }}
          path: podbor-linux-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          compression-level: 0
