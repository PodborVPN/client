# iOS: каждый push в main и PR — сборка без подписи на macOS. LibXray.xcframework (кеш по скрипту сборки),
# PodborKit.xcframework из общего Kotlin-кода, проект XcodeGen, xcodebuild приложения и расширения Packet Tunnel.
# Подпись и TestFlight — отдельным шагом, когда появится аккаунт Apple.
name: iOS

on:
  push:
    branches: [main, ios-ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: macos-latest
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # libXray пересобирается, только когда меняется скрипт сборки (в нём тег и коммит апстрима).
      - id: libxray
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Frameworks/LibXray.xcframework
          key: libxray-ios-${{ hashFiles('ios/scripts/build-libxray.sh') }}
      - if: steps.libxray.outputs.cache-hit != 'true'
        run: ios/scripts/build-libxray.sh
      - name: PodborKit.xcframework (core + driver + screen)
        run: ./gradlew :ios-kit:assemblePodborKitReleaseXCFramework
      - name: XcodeGen по закреплённому хешу
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml
      - name: xcodebuild без подписи (устройство)
        run: |
          xcodebuild -version
          xcodebuild -project ios/Podbor.xcodeproj -target Podbor -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit "${PIPESTATUS[0]}"
      - name: Размеры
        run: |
          app=ios/build/Release-iphoneos/Podbor.app
          du -sh "$app"
          ls -l "$app/Podbor" "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
