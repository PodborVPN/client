name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # PR релиза меняет только номер версии и CHANGELOG: тот же код соберётся после мёржа.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # libXray пересобирается, только когда меняется скрипт сборки (в нём тег и коммит апстрима).
      - id: libxray
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/libs/libXray.aar
          key: libxray-${{ hashFiles('app/scripts/build-libxray.sh') }}
      - if: steps.libxray.outputs.cache-hit != 'true'
        run: app/scripts/build-libxray.sh
      # Kotlin/Native для проверки common-кода ядра (:core:test) — по версии Kotlin из каталога.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: GO111MODULE=off go test ./linux/docker/xray-owner
      - run: ./gradlew :core:test :driver:test :screen:jvmTest :linux:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests
            app/build/reports/lint-results-*

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
